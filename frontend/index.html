    <style>
      /* Global mobile responsiveness */
      @media (max-width: 768px) {
        /* Prevent horizontal overflow */
        body, #root { overflow-x: hidden; max-width: 100vw; }

        /* Stack grids on mobile */
        .grid-cols-2, .md\:grid-cols-2, .md\:grid-cols-3, .md\:grid-cols-4,
        .lg\:grid-cols-2, .lg\:grid-cols-3, .lg\:grid-cols-4 {
          grid-template-columns: 1fr !important;
        }

        /* Full width cards */
        .max-w-6xl, .max-w-7xl, .max-w-5xl { padding-left: 12px !important; padding-right: 12px !important; }

        /* Smaller text on mobile */
        .text-5xl, .text-6xl, .text-7xl { font-size: 2rem !important; line-height: 1.15 !important; }
        .text-4xl { font-size: 1.75rem !important; }
        .text-3xl { font-size: 1.5rem !important; }

        /* Fix two-column layouts */
        .grid[style*="grid-template-columns: 1fr 1fr"],
        .grid[style*="grid-template-columns: 40%"],
        [style*="grid-template-columns: 1fr 1fr"] {
          grid-template-columns: 1fr !important;
        }

        /* Scrollable tab rows */
        .overflow-x-auto { -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .overflow-x-auto::-webkit-scrollbar { display: none; }

        /* Touch-friendly tap targets */
        button, a, [role="button"] { min-height: 36px; }

        /* Prevent images from overflowing */
        img { max-width: 100%; height: auto; }

        /* Fix fixed modals */
        .fixed.inset-0 { padding: 8px !important; }
        .fixed.inset-0 > div { max-height: 90vh !important; overflow-y: auto !important; }

        /* Bottom safe area for phones with gesture bar */
        .pb-10, .pb-12, .pb-16 { padding-bottom: calc(2.5rem + env(safe-area-inset-bottom)) !important; }
      }

      /* PWA standalone mode adjustments */
      @media (display-mode: standalone) {
        body { padding-top: env(safe-area-inset-top); }
      }

      /* Smooth scrolling */
      html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }

      /* Better touch interactions */
      * { -webkit-tap-highlight-color: transparent; }
      input, textarea, select { font-size: 16px !important; } /* Prevents iOS zoom on focus */

      /* Bottom nav spacing on mobile */
      @media (max-width: 640px) {
        #root > div { padding-bottom: 70px !important; }
      }
    </style>
  </head>
